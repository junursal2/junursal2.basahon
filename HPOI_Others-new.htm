/* ==========================
   Google Images Style Gallery
   ========================== */

.gallery {
    column-count: 5;
    column-gap: 8px;
    padding: 4px;
}

.gallery-item {
    position: relative;
    display: inline-block;
    width: 100%;
    margin-bottom: 8px;

    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
}

.gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    transition: transform .15s ease;
}

.gallery-item img:hover {
    transform: scale(1.02);
}

/* Responsive */

@media (max-width:1400px){
    .gallery{
        column-count:5;
    }
}

@media (max-width:1100px){
    .gallery{
        column-count:4;
    }
}

@media (max-width:850px){
    .gallery{
        column-count:3;
    }
}

@media (max-width:650px){
    .gallery{
        column-count:2;
    }
}

@media (max-width:480px){
    .gallery{
        column-count:1;
    }
}

    /* Top button */
    #myTopBtn {
        font-size: 18px;
        display: none;
        position: fixed;
        bottom: 40px;
        right: 30px;
        z-index: 99;
        border: 1px solid;
        outline: none;
        background-color: blue;
        color: white;
        cursor: pointer;
        padding: 1px 3px 1px 3px;
        border-radius: 3px;
    }

    #myTopBtn:hover {color: #FFD700;}


/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 9998;
    inset: 0;
    overflow: auto;
    background-color: rgba(0,0,0,0.9);
}

/* Desktop/default */
.modal-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 95vw;
    max-height: 95vh;
}

.modal-content {
    display: block;
    max-width: 95vw;
    max-height: 90vh;/*80*/
    width: auto;
    height: auto;
    object-fit: contain;
    margin: auto;
}

/* Caption below image */
.modal-caption {
    color: white;
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
    padding: 0 10px;
    max-width: 95vw;
    line-height: 1.3;
}

/* Desktop arrows overlay */
.carousel-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    padding: 6px 10px;
    line-height: 1;
    pointer-events: auto;
}

.prev {
    left: -38px;
}

.next {
    right: -38px;
}

.nav:hover {
    color: #FFD700;
}

/* Close button */
.close {
    position: absolute;
    top: 12px;
    right: 22px;
    color: #f1f1f1;
    font-size: 20px;
    font-weight: bold;
    transition: 0.3s;
    z-index: 10000;
    cursor: pointer;
    line-height: 1;
}

.close:hover,
.close:focus {
    color: #bbb;
    text-decoration: none;
}

/* Mobile: arrows below image */
@media only screen and (max-width: 700px) {
    .modal-inner {
        width: 95vw;
    }

    .modal-content {
        max-width: 95vw;
        max-height: 85vh;/*70*/
    }

    .modal-caption {
        font-size: 11px;
        margin-top: 4px;
    }

    .carousel-controls {
        position: static;
        inset: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-top: 8px;
        pointer-events: auto;
    }

    .nav {
        position: static;
        top: auto;
        transform: none;
        font-size: 18px;
        padding: 2px 6px;
    }

    .prev,
    .next {
        left: auto;
        right: auto;
    }

    .close {
        top: 10px;
        right: 16px;
        font-size: 22px;
    }
}

<script>
    // ==========================================
    // Top Button
    // ==========================================
    window.onscroll = scrollFunction;

    function scrollFunction() {
        const btn = document.getElementById("myTopBtn");
        btn.style.display =
            (document.body.scrollTop > 20 ||
             document.documentElement.scrollTop > 20)
                ? "block"
                : "none";
    }

    function topFunction() {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
    }

    // ==========================================
    // Modal / Carousel
    // ==========================================
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("img01");
    const captionText = document.getElementById("caption");
    const closeBtn = document.querySelector(".close");
    const galleryImages = Array.from(document.querySelectorAll(".thumbnail"));

    let currentIndex = 0;
    let startX = 0;
    let startY = 0;
    let hasSwiped = false;

    function image(img) {
        currentIndex = galleryImages.indexOf(img);
        modal.style.display = "block";
        updateModalImage();
    }

function updateModalImage() {
    const currentImg = galleryImages[currentIndex];
    modalImg.src = currentImg.dataset.full || currentImg.src;
    modalImg.alt = currentImg.title || "";

    const photoNumber = currentIndex + 1;
    const photoTitle = currentImg.title || "";

    captionText.textContent = `${photoTitle}`;
}

    function changeImage(direction) {
        currentIndex += direction;

        if (currentIndex < 0) {
            currentIndex = galleryImages.length - 1;
        } else if (currentIndex >= galleryImages.length) {
            currentIndex = 0;
        }

        updateModalImage();
    }

    function closeModal() {
        modal.style.display = "none";
    }

    // ==========================================
    // Modal Closing
    // ==========================================
    closeBtn.addEventListener("click", closeModal);

    // Close when clicking dark background only
    modal.addEventListener("click", function (e) {
        if (e.target === modal) {
            closeModal();
        }
    });

    // Desktop: double-click image to close
    modalImg.addEventListener("dblclick", function () {
        if (window.innerWidth > 700) {
            closeModal();
        }
    });

    // Mobile: single tap image to close
    modalImg.addEventListener("click", function () {
        if (window.innerWidth <= 700 && !hasSwiped) {
            closeModal();
        }
        hasSwiped = false;
    });

    // ==========================================
    // Keyboard Navigation
    // ==========================================
    document.addEventListener("keydown", function (e) {
        if (modal.style.display !== "block") return;

        switch (e.key) {
            case "ArrowLeft":
                changeImage(-1);
                break;
            case "ArrowRight":
                changeImage(1);
                break;
            case "Escape":
                closeModal();
                break;
        }
    });

    // ==========================================
    // Mobile Swipe Navigation
    // ==========================================
    modalImg.addEventListener("touchstart", function (e) {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        hasSwiped = false;
    }, { passive: true });

    modalImg.addEventListener("touchend", function (e) {
        const touch = e.changedTouches[0];
        const endX = touch.clientX;
        const endY = touch.clientY;

        const diffX = endX - startX;
        const diffY = endY - startY;

        // Only treat as swipe if mostly horizontal and long enough
        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
            hasSwiped = true;

            if (diffX < 0) {
                changeImage(1);   // swipe left -> next
            } else {
                changeImage(-1);  // swipe right -> previous
            }
        }
    }, { passive: true });
</script>

</body>
</html>
