<style>

        cursor: pointer;
        padding: 1px 3px 1px 3px;
        border-radius: 3px;
    }

    #myTopBtn:hover {color: #FFD700;}

    /* Responsive columns */
    @media screen and (max-width: 800px) {
        .column {
            -ms-flex: 50%;
            flex: 50%;
            max-width: 50%;
        }
    }

    @media screen and (max-width: 600px) {
        .column {
            -ms-flex: 100%;
            flex: 100%;
            max-width: 100%;
        }

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 9998;
    inset: 0;
    overflow: auto;
    background-color: rgba(0,0,0,0.9);
}

/* Desktop/default */
.modal-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 95vw;
    max-height: 95vh;
}

.modal-content {
    display: block;
    max-width: 95vw;
    max-height: 80vh;
    width: auto;
    height: auto;
    object-fit: contain;
    margin: auto;
}

/* Caption below image */
.modal-caption {
    color: white;
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
    padding: 0 10px;
    max-width: 95vw;
    line-height: 1.3;
}

/* Desktop arrows overlay */
.carousel-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    padding: 6px 10px;
    line-height: 1;
    pointer-events: auto;
}

.prev {
    left: -38px;
}

.next {
    right: -38px;
}

.nav:hover {
    color: #FFD700;
}

/* Close button */
.close {
    position: absolute;
    top: 12px;
    right: 22px;
    color: #f1f1f1;
    font-size: 20px;
    font-weight: bold;
    transition: 0.3s;
    z-index: 10000;
    cursor: pointer;
    line-height: 1;
}

.close:hover,
.close:focus {
    color: #bbb;
    text-decoration: none;
}

/* Mobile: arrows below image */
@media only screen and (max-width: 700px) {
    .modal-inner {
        width: 95vw;
    }

        max-width: 95vw;
        max-height: 70vh;
    }

        font-size: 11px;
        margin-top: 4px;
    }

    .carousel-controls {
        position: static;
        inset: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-top: 8px;
        pointer-events: auto;
    }

    .nav {
        position: static;
        top: auto;
        transform: none;
        font-size: 18px;
        padding: 2px 6px;
    }

    .prev,
    .next {
        left: auto;
        right: auto;
    }

    .close {
        top: 10px;
        right: 16px;
        font-size: 22px;
    }
}

<script>
    // ==========================================
    // Top Button
    // ==========================================
    window.onscroll = scrollFunction;

    function scrollFunction() {
        const btn = document.getElementById("myTopBtn");
        btn.style.display =
            (document.body.scrollTop > 20 ||
             document.documentElement.scrollTop > 20)
                ? "block"
                : "none";
    }

    function topFunction() {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
    }

    // ==========================================
    // Modal / Carousel
    // ==========================================
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("img01");
    const captionText = document.getElementById("caption");
    const closeBtn = document.querySelector(".close");
    const galleryImages = Array.from(document.querySelectorAll(".thumbnail"));

    let currentIndex = 0;
    let startX = 0;
    let startY = 0;
    let hasSwiped = false;

    function image(img) {
        currentIndex = galleryImages.indexOf(img);
        modal.style.display = "block";
        updateModalImage();
    }

function updateModalImage() {
    const currentImg = galleryImages[currentIndex];
    modalImg.src = currentImg.dataset.full || currentImg.src;
    modalImg.alt = currentImg.title || "";

    const photoNumber = currentIndex + 1;
    const photoTitle = currentImg.title || "";

    captionText.textContent = `Photo ${photoNumber} — ${photoTitle}`;
}

    function changeImage(direction) {
        currentIndex += direction;

        if (currentIndex < 0) {
            currentIndex = galleryImages.length - 1;
        } else if (currentIndex >= galleryImages.length) {
            currentIndex = 0;
        }

        updateModalImage();
    }

    function closeModal() {
        modal.style.display = "none";
    }

    // ==========================================
    // Modal Closing
    // ==========================================
    closeBtn.addEventListener("click", closeModal);

    // Close when clicking dark background only
    modal.addEventListener("click", function (e) {
        if (e.target === modal) {
            closeModal();
        }
    });

    // Desktop: double-click image to close
    modalImg.addEventListener("dblclick", function () {
        if (window.innerWidth > 700) {
            closeModal();
        }
    });

    // Mobile: single tap image to close
    modalImg.addEventListener("click", function () {
        if (window.innerWidth <= 700 && !hasSwiped) {
            closeModal();
        }
        hasSwiped = false;
    });

    // ==========================================
    // Keyboard Navigation
    // ==========================================
    document.addEventListener("keydown", function (e) {
        if (modal.style.display !== "block") return;

        switch (e.key) {
            case "ArrowLeft":
                changeImage(-1);
                break;
            case "ArrowRight":
                changeImage(1);
                break;
            case "Escape":
                closeModal();
                break;
        }
    });

    // ==========================================
    // Mobile Swipe Navigation
    // ==========================================
    modalImg.addEventListener("touchstart", function (e) {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        hasSwiped = false;
    }, { passive: true });

    modalImg.addEventListener("touchend", function (e) {
        const touch = e.changedTouches[0];
        const endX = touch.clientX;
        const endY = touch.clientY;

        const diffX = endX - startX;
        const diffY = endY - startY;

        // Only treat as swipe if mostly horizontal and long enough
        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
            hasSwiped = true;

            if (diffX < 0) {
                changeImage(1);   // swipe left -> next
            } else {
                changeImage(-1);  // swipe right -> previous
            }
        }
    }, { passive: true });
</script>
